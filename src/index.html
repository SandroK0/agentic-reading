<!DOCTYPE html>
<html lang="en" data-theme="ink">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; frame-src widget:">
  <title>Agentic Reading</title>
</head>
<body>
  <header class="toolbar">
    <button id="open-btn" title="Open a PDF or EPUB (⌘O)">Open</button>
    <button id="toc-btn" title="Show or hide the table of contents" aria-pressed="true" hidden>Contents</button>
    <span class="title" id="title">Agentic Reading</span>
    <div class="nav" id="nav" hidden>
      <button id="prev" aria-label="Previous page">‹</button>
      <input id="page-input" type="number" min="1" value="1" aria-label="Page number">
      <span id="page-total" class="muted">/ –</span>
      <button id="next" aria-label="Next page">›</button>
      <span class="gap"></span>
      <button id="zoom-out" aria-label="Zoom out">−</button>
      <span id="zoom-label" class="muted">100%</span>
      <button id="zoom-in" aria-label="Zoom in">+</button>
    </div>
    <label class="theme">
      <span class="muted">Theme</span>
      <select id="theme"></select>
    </label>
    <label class="model">
      <span class="muted">Model</span>
      <select id="model"></select>
    </label>
    <button id="panel-btn" title="Show or hide the explanations" aria-pressed="true">Explanations</button>
  </header>

  <main class="layout">
    <nav class="toc" id="toc" aria-label="Contents" hidden>
      <div class="toc-head">Contents</div>
      <div class="toc-body" id="toc-body"></div>
    </nav>
    <div class="resizer" id="toc-resizer" aria-label="Resize contents" title="Drag to resize, double-click to reset"></div>

    <section class="viewer" id="viewer">
      <div class="empty" id="empty">
        <h1>Open a book to start reading</h1>
        <p class="muted">Drop a PDF or EPUB here or press ⌘O. Select any passage and choose <b>Explain</b> or <b>Explain visually</b>.</p>
        <div class="recents" id="recents"></div>
      </div>
      <div class="pages" id="pages" hidden></div>
      <div class="selection-menu" id="selection-menu" role="toolbar" aria-label="Selected text" hidden>
        <input id="selection-question" type="text" autocomplete="off" spellcheck="false"
               placeholder="Ask something specific (optional)" aria-label="Question about the selected text"
               title="Leave empty for a general explanation. Enter explains, Esc closes.">
        <div class="selection-menu-actions">
        <button id="explain-text" title="Short written explanation (E)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6" /></svg>
          Explain
        </button>
        <span class="selection-menu-divider" aria-hidden="true"></span>
        <button id="explain-visual" title="Explain with a drawing (V)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1" /><circle cx="11.25" cy="4.75" r="2.25" /><path d="M2.5 13.5 5 9.5l2.5 4zM9 10.5h4.5M9 13h3" /></svg>
          Explain visually
        </button>
        </div>
      </div>
    </section>

    <div class="resizer" id="panel-resizer" aria-label="Resize explanations" title="Drag to resize, double-click to reset"></div>
    <aside class="panel" id="panel">
      <div class="panel-head">
        <span class="panel-title">Explanations <span class="muted" id="count"></span></span>
        <button class="icon-btn" id="panel-collapse-all" title="Minimise or expand all" aria-label="Minimise or expand all explanations">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3.5 8 6.5l3.5-3M4.5 12.5 8 9.5l3.5 3" /></svg>
        </button>
        <button class="icon-btn" id="panel-popout" title="Open in a new window" aria-label="Open in a new window">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path class="when-docked" d="M9.5 2.5h4v4M13.5 2.5 8 8M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3" /><path class="when-window" d="M8 8V3.5M8 8H3.5M8 8 2.5 2.5M4 9.5v3a1 1 0 0 0 1 1h7.5a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-3" /></svg>
        </button>
        <button class="icon-btn" id="panel-close" title="Hide the explanations" aria-label="Hide the explanations">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
        </button>
      </div>
      <div class="cards" id="cards">
        <p class="muted hint" id="cards-empty">Your explainers for this book will collect here.</p>
      </div>
    </aside>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
